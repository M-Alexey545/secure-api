name: Security CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sast-bandit:
    name: SAST - Bandit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit

      - name: Run Bandit
        run: |
          python -m bandit -r . -x ./venv,./.git -f txt -o bandit-report.txt || true
          python -m bandit -r . -x ./venv,./.git -f json -o bandit-report.json || true
          python -m bandit -r . -x ./venv,./.git || true

      - name: Upload Bandit reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bandit-reports
          path: |
            bandit-report.txt
            bandit-report.json

  sca-pip-audit:
    name: SCA - pip-audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit

      - name: Run pip-audit
        run: |
          python -m pip-audit -r requirements.txt --format json --output pip-audit-report.json || true
          if [ ! -s pip-audit-report.json ]; then
            echo '{"audit_failed": true, "message": "pip-audit did not produce a report"}' > pip-audit-report.json
          fi
          cat pip-audit-report.json

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json